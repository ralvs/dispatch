name: E2E

# The integration layer and the end-to-end smoke (docs/adr/0063), against a
# local Supabase stack on the runner. Needs no secret: every key comes from
# `supabase status`, `readLocalStack()` refuses any non-local host, and
# playwright.config.ts sets every integration key — the AI gateway included —
# to "". A secret in this workflow is a bug.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a PR cancels its older run; runs on main always finish.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    # Not a required check yet (#50): it becomes one after a week green
    # without flakes. Renaming it then means updating the ruleset too.
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        id: supabase
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0

      # Image tags ship inside the CLI release. `ghcr` is in the key because
      # that is the name `docker save` records on a miss.
      - name: Supabase image cache key
        run: >
          echo "SUPABASE_IMAGE_CACHE_KEY=supabase-images-${{ runner.os }}-${{ runner.arch }}-ghcr-${{ steps.supabase.outputs.version }}"
          >> "$GITHUB_ENV"

      - name: Restore Supabase images
        id: supabase-images
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/supabase-images
          key: ${{ env.SUPABASE_IMAGE_CACHE_KEY }}

      - name: Load Supabase images
        if: steps.supabase-images.outputs.cache-hit == 'true'
        run: docker load --input ~/.cache/supabase-images/images.tar

      # A miss pulls from GHCR for this job. CLI 2.115.0 otherwise tries
      # public.ecr.aws first, and from shared runner IPs that registry
      # returns `toomanyrequests: Data limit exceeded` — the same wording
      # Docker Hub uses — before falling through to GHCR. An explicit
      # registry skips that first hop. A hit leaves the variable unset:
      # the loaded ghcr.io tags are already local, and `supabase start`
      # checks every candidate locally before it pulls.
      - name: Point a cache miss at GHCR
        if: success() && steps.supabase-images.outputs.cache-hit != 'true'
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io" >> "$GITHUB_ENV"

      # Only what the app and the tests reach: Postgres, GoTrue (sign-in),
      # PostgREST and Kong in front of them. Applies supabase/migrations/ and
      # supabase/seed.sql, which adds the owner the tests sign in as.
      # One retry: a second `supabase start` resumes a half-finished pull.
      - name: Start the local stack
        run: |
          start_stack() {
            supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          }
          if ! start_stack; then
            echo "supabase start failed; retrying once"
            start_stack
          fi

      # `gen types` does not walk the ECR → GHCR fallback (CLI 2.115.0). It
      # pulls one image, postgres-meta, from public.ecr.aws unless this is
      # set. That pull is what failed the 2026-10-28 run, after start had
      # already recovered via GHCR. The variable names the tag the cache
      # stores, so a hit is a local image and does not pull.
      - name: Generated types match the schema
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: >-
          supabase gen types typescript --local --schema public
          | bunx biome format --stdin-file-path=lib/database.types.ts
          | diff -u lib/database.types.ts -

      - name: Save Supabase images
        if: success() && steps.supabase-images.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/supabase-images
          images=()
          while IFS= read -r image; do
            images+=("$image")
          done < <(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep '^ghcr.io/supabase/' | grep -v ':<none>$' || true)
          if ((${#images[@]} == 0)); then
            echo "::error::No ghcr.io/supabase images to cache."
            exit 1
          fi
          docker save --output ~/.cache/supabase-images/images.tar "${images[@]}"
          du -h ~/.cache/supabase-images/images.tar

      # A concurrent miss may already have saved this key. The stack is up
      # either way; losing the upload must not fail the tests.
      - name: Cache Supabase images
        if: success() && steps.supabase-images.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/supabase-images
          key: ${{ env.SUPABASE_IMAGE_CACHE_KEY }}

      - name: Playwright version
        id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install the Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install the Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Integration
        run: bun run test:integration

      # Builds the app with `next build` and serves it on :3300.
      - name: End to end
        run: bun run test:e2e

      - name: Upload the Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
