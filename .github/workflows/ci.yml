name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a PR cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # The ruleset on main requires this job by name (docs/adr/0063).
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      # Biome, tsc and Vitest — the same gate as before every commit. No
      # secrets: every variable in lib/env.ts is optional.
      - name: Check
        run: bun run check
