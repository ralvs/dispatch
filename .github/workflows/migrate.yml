name: Migrate

# Applies new supabase/migrations files to production after every merge to
# main (docs/adr/0065). `supabase db push` runs only what the production
# history table lacks, so a merge without a migration is a quick no-op.
# Vercel's Deployment Checks wait for this job before the new code goes live.
on:
  push:
    branches:
      - main
  # A manual re-run, e.g. after fixing a failed migration.
  workflow_dispatch:

permissions:
  contents: read

# Never two pushes at once, and never cancel one half-way.
concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate
    # A manual run from another branch would apply unreviewed SQL to
    # production. Only main, whatever started the run.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      # The session pooler URL (port 5432): runners have no IPv6, and the
      # direct database host is IPv6 only. It carries the password, so it is a
      # secret, and main is the only ref that ever sees it.
      - name: Apply pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "::error::SUPABASE_DB_URL secret is not set."
            exit 1
          fi
          supabase db push --db-url "$SUPABASE_DB_URL" --yes
